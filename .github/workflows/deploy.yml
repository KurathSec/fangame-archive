name: Sync and Deploy Fangame Archive

on:
  schedule:
    - cron: '0 */6 * * *' # Run every 6 hours
  workflow_dispatch:      # Enable manual triggering from GitHub Action UI
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'pipelines/**'
      - 'wrangler.toml'
      - '.github/workflows/**'
      - 'package.json'
      - 'package-lock.json'
      - 'requirements.txt'

# Serialize runs: the 6-hourly cron and a push must never run at the same time, or
# two pipelines race on the R2 master games.json and collide the version counter
# (see project_architecture.md §8.5 rebase caution / §10). Queue, don't cancel, so an
# in-flight sync finishes cleanly.
concurrency:
  group: fangame-archive-deploy
  cancel-in-progress: false

# Least privilege: the job deploys to Cloudflare Pages via an API token; it does not
# push back to the repository.
permissions:
  contents: read

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Delicious Fruit is moving to a new site (2026-10-24): every old page now
    # answers 200 with a placeholder. Until the scraper is ported, the scraper and
    # the screenshot sync send DF no requests at all. Set to 'on' to resume.
    env:
      DF_SYNC: 'off'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Node Dependencies
        # esbuild (used by build_github_pages.py, invoked inside the scraper step) and
        # wrangler (used by the deploy step) come from the pinned devDependencies.
        run: npm ci

      - name: Fetch the Browser Player (gm-recomp)
        # /play/ runs games on gm-recomp's player bundle (README, "Play in the browser"),
        # published as a release asset of github.com/KurathSec/gm-recomp. The build
        # (inside the scraper step) copies it into the site; without it the site still
        # deploys and /play/ reports that it cannot start games.
        env:
          GMR_PLAYER_URL: https://github.com/KurathSec/gm-recomp/releases/latest/download/gm-recomp-player.tar.gz
        run: |
          tmp=$(mktemp -d)
          if curl -fsSL "$GMR_PLAYER_URL" -o "$tmp/player.tar.gz" && mkdir "$tmp/gmr" && tar -xzf "$tmp/player.tar.gz" -C "$tmp/gmr"; then
            rm -rf public/play/gmr && mv "$tmp/gmr" public/play/gmr
            echo "browser player $(cat public/play/gmr/VERSION 2>/dev/null)"
          else
            echo "::warning::browser player bundle unavailable; /play/ will not start games"
          fi

      - name: Install Engine Recognition Tools
        # Used by pipelines/engine_recognition.py (invoked inside the scraper step):
        # 7zz extracts game archives (7zip-rar adds the RAR codec; if it is ever
        # unavailable, RAR games simply record a failed attempt) and upx unpacks
        # UPX-compressed game executables before signature detection.
        run: |
          sudo apt-get update
          sudo apt-get install -y 7zip upx-ucl
          sudo apt-get install -y 7zip-rar || echo "::warning::7zip-rar unavailable; RAR archives will not be recognized"

      - name: Download Databases from R2
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: python pipelines/sync_db_r2.py download

      # Stamps release_date from the committed data/release_dates.json artifact
      # onto any games still missing it (bumps DATABASE_VERSION with no timeline
      # entry -> one full client reload). No-ops with zero assignments, so it is
      # safe to keep permanently. Needs no secrets: local files + public wiki API.
      - name: Backfill Release Dates (idempotent)
        run: python pipelines/backfill_release_dates.py --apply --ci

      # Stamps auto-captured cover screenshots from data/cover_screenshots.json
      # onto games that have none (the images are already in R2, uploaded from
      # the capture machine). No-ops with zero assignments; needs no secrets.
      - name: Backfill Cover Screenshots (idempotent)
        run: python pipelines/backfill_cover_screenshots.py --apply --ci

      # Stamps `source` ({type: df|wiki, id}) from database/seq_to_orig_map.json
      # onto games missing it, so the drawer and the public API can link back to
      # the upstream entry. The scraper stamps new games inline, so after the
      # first run this is a no-op safety net for remappings; needs no secrets.
      - name: Backfill Source Links (idempotent)
        run: python pipelines/backfill_source_links.py --apply --ci

      # Adds the IWanna Wiki cross-link for games ingested from Delicious Fruit,
      # from the committed data/wiki_links.json artifact (offline — no wiki call,
      # so a wiki outage can never thin the mapping). New games are matched
      # inline by the scraper, so this is a no-op after the first run.
      - name: Backfill Wiki Cross-links (idempotent)
        run: python pipelines/backfill_wiki_links.py --apply --ci

      - name: Merge Approved Game Submissions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: python pipelines/merge_approved_submissions.py

      - name: Apply Admin Game Operations
        # Drains the D1 `game_ops` queue written by the admin panel
        # (delete / clear_link / replace_link) into games.json + R2.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: python pipelines/apply_game_ops.py

      - name: Run Scraper and Compilation Pipeline
        # CLOUDFLARE_API_TOKEN is required so the in-pipeline D1 review sync
        # (npx wrangler d1 execute) can authenticate; without it the scrape
        # succeeds but new reviews never reach the D1 comments table.
        # This step also invokes build_github_pages.py, which precompiles the JSX
        # with esbuild (installed by `npm ci` above).
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: python pipelines/scrape_and_migrate_new_games.py

      - name: Sync Screenshots to R2
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: python pipelines/sync_screenshots_to_r2.py

      - name: Upload Updated Databases back to R2
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: python pipelines/sync_db_r2.py upload

      - name: Deploy Compiled Site to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy github_pages_dist --project-name fangame-archive
